name: Запуск бота по расписанию

on:
  # Запуск по расписанию (каждый день в 10:00 UTC)
  schedule:
    - cron: '0 10 * * *'
  
  # Ручной запуск через кнопку "Run workflow" на GitHub
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-22.04
    
    steps:
      # 1. Checkout кода из репозитория
      - name: Checkout кода
        uses: actions/checkout@v4
      
      # 2. Установка Python
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      # 3. Установка зависимостей Python
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Установка браузера Playwright (на Ubuntu 22.04 пройдет без ошибок)
      - name: Установка браузеров Playwright
        run: playwright install --with-deps chromium
      
      # 5. Создание cookies.txt из GitHub Secrets
      - name: Создание cookies.txt
        env:
          COOKIES_CONTENT: ${{ secrets.COOKIES_TXT }}
        run: |
          mkdir -p test
          echo "$COOKIES_CONTENT" > test/cookies.txt
      
      # 6. Запуск бота
      - name: Запуск бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test/bot.py
      
      # 7. Логирование результата
      - name: Статус выполнения
        if: always()
        run: echo "Бот выполнил работу в ${{ job.status }}"
