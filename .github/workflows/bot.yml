name: Запуск бота по расписанию

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
      
      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Кэширование Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
            
      - name: Установка браузера Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
        
      - name: Установка системных зависимостей
        run: playwright install-deps chromium
      
      - name: Создание cookies.txt
        env:
          COOKIES_CONTENT: ${{ secrets.COOKIES_TXT }}
        run: |
          mkdir -p test
          echo "$COOKIES_CONTENT" > test/cookies.txt
      
      - name: Запуск бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test/bot.py

      # --- ВОТ ЭТОТ ВАЖНЕЙШИЙ ШАГ ВЫГРУЗИТ КАРТИНКУ В АРТЕФАКТЫ ---
      - name: Сохранить скриншот для проверки
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshot
          path: error_screenshot.png
          if-no-files-found: ignore
      
      - name: Статус выполнения
        if: always()
        run: echo "Бот выполнил работу в ${{ job.status }}"
