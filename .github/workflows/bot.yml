# 3. Установка зависимостей Python (ОСТАВЛЯЕМ КАК БЫЛО)
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # --- ДОБАВЛЯЕМ КЭШИРОВАНИЕ БРАУЗЕРА ---
      - name: Кэширование Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
            
      # 4. Установка браузера Playwright (качаем только если нет в кэше)
      - name: Установка браузеров Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
        
      # Установка системных библиотек (шрифты и т.д. - это быстро)
      - name: Установка системных зависимостей
        run: playwright install-deps chromium
